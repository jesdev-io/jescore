name: jescore build system

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.environment }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        environment:
          - az-delivery-devkit-v4-release-arduino
          - az-delivery-devkit-v4-debug-arduino
          - nodemcu-32s-release-arduino
          - nodemcu-32s-debug-arduino
          - esp32-c3-devkitm-1-release-arduino
          - esp32-c3-devkitm-1-debug-arduino
          - esp32-s3-devkitc-1-release-arduino
          - esp32-s3-devkitc-1-debug-arduino
          - esp32-wrover-kit-release-arduino
          - esp32-wrover-kit-debug-arduino
          - esp32-heltec-v3-release-arduino
          - esp32-heltec-v3-debug-arduino
          - stm32_l476rg-release-cube
          - stm32_l476rg-debug-cube
          - stm32_l432kc-release-cube
          - stm32_l432kc-debug-cube
          - stm32_g431kb-release-cube
          - stm32_g431kb-debug-cube
          - stm32_h753zi-release-cube
          - stm32_h753zi-debug-cube

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Cache PlatformIO packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            .pio/libdeps
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Install PlatformIO Core
        run: python -m pip install --upgrade platformio

      - name: Build ${{ matrix.environment }}
        run: pio run -e "${{ matrix.environment }}"

  build-test-firmware:
    name: Build test firmware ${{ matrix.environment }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        environment:
          - az-delivery-devkit-v4-test-arduino
          - esp32-c3-devkitm-1-test-arduino
          - esp32-wrover-kit-test-arduino
          - esp32-s3-devkitc-1-test-arduino
          - stm32_l476rg-test-cube
          - stm32_l432kc-test-cube
          - stm32_g431kb-test-cube
          - stm32_h753zi-test-cube

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Cache PlatformIO packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            .pio/libdeps
          key: ${{ runner.os }}-pio-test-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-test-
            ${{ runner.os }}-pio-

      - name: Install PlatformIO Core
        run: python -m pip install --upgrade platformio

      - name: Build test firmware ${{ matrix.environment }}
        run: pio test -e "${{ matrix.environment }}" --without-uploading --without-testing

      - name: Upload test firmware artifact
        uses: actions/upload-artifact@v5
        with:
          name: firmware-${{ matrix.environment }}
          path: .pio/build/${{ matrix.environment }}/
          if-no-files-found: error
          retention-days: 7
