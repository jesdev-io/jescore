name: PlatformIO CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.environment }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        environment:
          - az-delivery-devkit-v4-release-arduino
          - az-delivery-devkit-v4-debug-arduino
          - nodemcu-32s-release-arduino
          - nodemcu-32s-debug-arduino
          - esp32-c3-devkitm-1-release-arduino
          - esp32-c3-devkitm-1-debug-arduino
          - esp32-s3-devkitc-1-release-arduino
          - esp32-s3-devkitc-1-debug-arduino
          - esp32-wrover-kit-release-arduino
          - esp32-wrover-kit-debug-arduino
          - esp32-heltec-v3-release-arduino
          - esp32-heltec-v3-debug-arduino
          - stm32_l476rg-release-cube
          - stm32_l476rg-debug-cube
          - stm32_l432kc-release-cube
          - stm32_l432kc-debug-cube
          - stm32_g431kb-release-cube
          - stm32_g431kb-debug-cube
          - stm32_h753zi-release-cube
          - stm32_h753zi-debug-cube
          - stm32_f413zh-release-cube
          - stm32_f413zh-debug-cube

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            .pio/libdeps
            ~/.cache/uv
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Build ${{ matrix.environment }}
        run: uv --from platformio pio run -e "${{ matrix.environment }}"
