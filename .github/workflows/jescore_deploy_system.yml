name: jescore deployment system

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-on-remote-agents:
    name: Physical MCU unit test
    runs-on: rpi-cm5-1
    environment:
      name: hardware-test
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        test-config:
          - { env: 'az-delivery-devkit-v4-test-arduino', platform: 'esp32', usb_port: '/dev/ttyUSB0' }
          - { env: 'esp32-c3-devkitm-1-test-arduino', platform: 'esp32', usb_port: '/dev/ttyUSB1' }
          - { env: 'esp32-wrover-kit-test-arduino', platform: 'esp32', usb_port: '/dev/ttyACM1' }
          - { env: 'esp32-s3-devkitc-1-test-arduino', platform: 'esp32', usb_port: '/dev/ttyACM2' }
          - { env: 'stm32_l476rg-test-cube', platform: 'stm32', usb_port: '/dev/ttyACM9' }
          - { env: 'stm32_l432kc-test-cube', platform: 'stm32', usb_port: '/dev/ttyACM10' }
          - { env: 'stm32_g431kb-test-cube', platform: 'stm32', usb_port: '/dev/ttyACM3' }
          - { env: 'stm32_h753zi-test-cube', platform: 'stm32', usb_port: '/dev/ttyACM7' }
          # Supported test MCUs not currently connected. Fill usb_port before enabling.
          # - { env: 'nodemcu-32s-test-arduino', platform: 'esp32', usb_port: '' }
          # - { env: 'esp32-heltec-v3-test-arduino', platform: 'esp32', usb_port: '' }
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check if agent is available and run tests
        shell: bash -l {0}
        env:
          TEST_ENV: ${{ matrix.test-config.env }}
          PLATFORM: ${{ matrix.test-config.platform }}
          USB_PORT: ${{ matrix.test-config.usb_port }}
        run: |
          echo "Running tests with environment $TEST_ENV (USB: $USB_PORT)..."
          pio test -e "$TEST_ENV" --upload-port "$USB_PORT" --test-port "$USB_PORT"

