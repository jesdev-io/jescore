name: jescore deployment system
run-name: Deploy ${{ github.event.workflow_run.display_title || inputs.build_run_id || github.sha }}

on:
  workflow_run:
    workflows: [jescore build system]
    types: [completed]
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Numeric run id of a successful jescore build system run, e.g. 30078427403 from /actions/runs/30078427403
        required: true

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

jobs:
  classify-deploy:
    name: Classify deploy trust
    runs-on: ubuntu-latest
    outputs:
      trusted: ${{ steps.classify.outputs.trusted }}
    steps:
      - name: Trust successful builds from protected in-repo branches
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          REPOSITORY: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          trusted=false
          if [ "$EVENT_NAME" = "workflow_run" ] \
            && [ "$CONCLUSION" = "success" ] \
            && [ "$HEAD_REPOSITORY" = "$REPOSITORY" ] \
            && { [ "$HEAD_BRANCH" = "dev" ] || [ "$HEAD_BRANCH" = "main" ]; }; then
            trusted=true
          fi

          echo "trusted=$trusted" >> "$GITHUB_OUTPUT"
          echo "trusted=$trusted"
          echo "event=$EVENT_NAME conclusion=$CONCLUSION repository=$HEAD_REPOSITORY branch=$HEAD_BRANCH"

  approve-hardware-tests:
    name: Approve hardware tests
    needs: classify-deploy
    if: ${{ (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') && needs.classify-deploy.outputs.trusted != 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: hardware-test
    steps:
      - name: Approval granted
        run: echo "Hardware test deployment approved."

  trusted-hardware-tests:
    name: Trusted hardware test gate
    needs: classify-deploy
    if: ${{ github.event.workflow_run.conclusion == 'success' && needs.classify-deploy.outputs.trusted == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Trusted source accepted
        run: echo "Trusted in-repo protected branch build; skipping manual hardware-test approval."

  test-on-remote-agents:
    name: Physical MCU unit test (${{ matrix.test-config.env }})
    if: ${{ always() && needs.classify-deploy.result == 'success' && (needs.approve-hardware-tests.result == 'success' || needs.trusted-hardware-tests.result == 'success') }}
    needs: [classify-deploy, approve-hardware-tests, trusted-hardware-tests]
    runs-on: rpi-cm5-1
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        test-config:
          - env: 'az-delivery-devkit-v4-test-arduino'
            platform: 'esp32'
            usb_port: '/dev/serial/by-id/usb-Silicon_Labs_CP2102_USB_to_UART_Bridge_Controller_0001-if00-port0'
            usb_id: 'Silicon_Labs_CP2102_USB_to_UART_Bridge_Controller_0001'
            esp_mac: 'c8:c9:a3:d2:31:00'
          - env: 'esp32-c3-devkitm-1-test-arduino'
            platform: 'esp32'
            usb_port: '/dev/serial/by-id/usb-1a86_USB_Serial-if00-port0'
            usb_id: '1a86_USB_Serial'
            esp_mac: '34:b4:72:f9:cd:88'
          - env: 'esp32-wrover-kit-test-arduino'
            platform: 'esp32'
            usb_port: '/dev/serial/by-id/usb-1a86_USB_Single_Serial_54F4019606-if00'
            usb_id: '1a86_USB_Single_Serial_54F4019606'
            esp_mac: 'c0:49:ef:1f:70:d8'
          - env: 'esp32-s3-devkitc-1-test-arduino'
            platform: 'esp32'
            usb_port: '/dev/serial/by-id/usb-1a86_USB_Single_Serial_578E007460-if00'
            usb_id: '1a86_USB_Single_Serial_578E007460'
            esp_mac: '80:65:99:c7:a1:8c'
          - env: 'stm32_l476rg-test-cube'
            platform: 'stm32'
            usb_port: '/dev/serial/by-id/usb-STMicroelectronics_STM32_STLink_066DFF574857847167033357-if02'
            stlink_serial: '066DFF574857847167033357'
            openocd_target: 'stm32l4x.cfg'
          - env: 'stm32_l432kc-test-cube'
            platform: 'stm32'
            usb_port: '/dev/serial/by-id/usb-STMicroelectronics_STM32_STLink_066AFF574884654867052433-if02'
            stlink_serial: '066AFF574884654867052433'
            openocd_target: 'stm32l4x.cfg'
          - env: 'stm32_g431kb-test-cube'
            platform: 'stm32'
            usb_port: '/dev/serial/by-id/usb-STMicroelectronics_STLINK-V3_003600253137510639383538-if02'
            stlink_serial: '003600253137510639383538'
            openocd_target: 'stm32g4x.cfg'
          - env: 'stm32_h753zi-test-cube'
            platform: 'stm32'
            usb_port: '/dev/serial/by-id/usb-STMicroelectronics_STLINK-V3_004300483033511935393935-if02'
            stlink_serial: '004300483033511935393935'
            openocd_target: 'stm32h7x.cfg'
          # Supported test MCUs not currently connected. Fill usb_port and stable identifier before enabling.
          # - env: 'nodemcu-32s-test-arduino'
          #   platform: 'esp32'
          #   usb_port: ''
          #   usb_id: ''
          #   esp_mac: ''
          # - env: 'esp32-heltec-v3-test-arduino'
          #   platform: 'esp32'
          #   usb_port: ''
          #   usb_id: ''
          #   esp_mac: ''
          # Planned and already connected
          # - env: 'stm32_u5-test-cube'
          #   platform: 'stm32'
          #   usb_port: '/dev/ttyACM5'
          #   stlink_serial: '003000313156501920323443'
          #   openocd_target: 'stm32u5x.cfg'
          # - env: 'stm32_l5-test-cube'
          #   platform: 'stm32'
          #   usb_port: '/dev/ttyACM6'
          #   stlink_serial: '066DFF505048878667122910'
          #   openocd_target: 'stm32l5x.cfg'
          # - env: 'stm32_f4-test-cube'
          #   platform: 'stm32'
          #   usb_port: '/dev/ttyACM7'
          #   stlink_serial: '0672FF505453707867175134'
          #   openocd_target: 'stm32f4x.cfg'
          # - env: 'stm32_n6-test-cube'
          #   platform: 'stm32'
          #   usb_port: '/dev/ttyACM9'
          #   stlink_serial: '001200174142501620353451'
          #   openocd_target: ''

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve build run id
        id: build-run
        env:
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          MANUAL_BUILD_RUN_ID: ${{ inputs.build_run_id }}
        run: |
          raw="${WORKFLOW_RUN_ID:-$MANUAL_BUILD_RUN_ID}"
          run_id="$(printf '%s' "$raw" | grep -Eo '[0-9]+' | tail -n 1)"
          if [ -z "$run_id" ]; then
            echo "Could not resolve a numeric run id from: $raw" >&2
            exit 1
          fi
          echo "run-id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download precompiled test firmware
        uses: actions/download-artifact@v5
        with:
          name: firmware-${{ matrix.test-config.env }}
          path: .pio/build/${{ matrix.test-config.env }}
          run-id: ${{ steps.build-run.outputs.run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify selected USB device matches matrix entry
        shell: bash -l {0}
        env:
          PLATFORM: ${{ matrix.test-config.platform }}
          USB_PORT: ${{ matrix.test-config.usb_port }}
          USB_ID: ${{ matrix.test-config.usb_id }}
          ESP_MAC: ${{ matrix.test-config.esp_mac }}
          STLINK_SERIAL: ${{ matrix.test-config.stlink_serial }}
        run: |
          set -euo pipefail
          echo "Selected USB port: $USB_PORT"
          test -e "$USB_PORT"
          udevadm info -q property -n "$USB_PORT" | sort

          if [ "$PLATFORM" = "stm32" ]; then
            actual="$(udevadm info -q property -n "$USB_PORT" | awk -F= '/^ID_SERIAL_SHORT=/{print $2}')"
            test "$actual" = "$STLINK_SERIAL"
            echo "Verified STM32 ST-LINK serial $STLINK_SERIAL on $USB_PORT"
          elif [ "$PLATFORM" = "esp32" ]; then
            udevadm info -q property -n "$USB_PORT" | grep -F "ID_SERIAL=$USB_ID"
            uvx --from esptool esptool --port "$USB_PORT" chip-id 2>&1 | tee /tmp/esptool-chip-id.log
            grep -F "MAC:                $ESP_MAC" /tmp/esptool-chip-id.log
            echo "Verified ESP MAC $ESP_MAC on $USB_PORT"
          fi

      - name: Upload firmware and run tests
        shell: bash -l {0}
        env:
          TEST_ENV: ${{ matrix.test-config.env }}
          PLATFORM: ${{ matrix.test-config.platform }}
          USB_PORT: ${{ matrix.test-config.usb_port }}
          STLINK_SERIAL: ${{ matrix.test-config.stlink_serial }}
          OPENOCD_TARGET: ${{ matrix.test-config.openocd_target }}
        run: |
          set -euo pipefail
          echo "Running tests with precompiled firmware for $TEST_ENV (USB: $USB_PORT)..."

          if [ "$PLATFORM" = "stm32" ]; then
            openocd \
              -f interface/stlink.cfg \
              -c "adapter serial $STLINK_SERIAL" \
              -f "target/$OPENOCD_TARGET" \
              -c "program .pio/build/$TEST_ENV/firmware.elf verify reset exit"

            pio test -e "$TEST_ENV" --without-building --without-uploading --test-port "$USB_PORT" -vvv &
            test_pid=$!
            sleep 2
            openocd \
              -f interface/stlink.cfg \
              -c "adapter serial $STLINK_SERIAL" \
              -f "target/$OPENOCD_TARGET" \
              -c "init; reset run; shutdown"
            wait "$test_pid"
          else
            pio test -e "$TEST_ENV" --without-building --upload-port "$USB_PORT" --test-port "$USB_PORT" -vvv
          fi
